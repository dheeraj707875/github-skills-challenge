name: Python Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies and coverage tools
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest==8.4.1 pytest-cov==7.1.0 coverage==7.16.1

      - name: Run tests with coverage
        run: |
          PYTHONPATH=. pytest tests --cov=src --cov-report=term-missing --cov-report=xml

      - name: Enforce minimum coverage threshold
        run: |
          coverage report --fail-under=58

      - name: Publish coverage comment to PR
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70
          COVERAGE_PATH: .
